name: fox1
description: "FOX-1: a wearable AI companion. An Android launcher with a live fox you talk to."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  archive: ^4.0.9          # backup zips (MIT)

  # State management
  flutter_riverpod: ^2.6.1

  # Networking
  web_socket_channel: ^3.0.3
  http: ^1.3.0

  # Audio
  record: ^6.2.0
  just_audio: ^0.10.5
  audio_session: ^0.2.2

  # Camera
  camera: ^0.11.1
  image: ^4.5.3

  # Fonts
  google_fonts: ^6.2.1

  # QR code
  qr_flutter: ^4.1.0

  # HTTP server
  shelf: ^1.4.2
  shelf_router: ^1.1.4

  # Utils
  shared_preferences: ^2.5.4
  permission_handler: ^12.0.1
  battery_plus: ^6.2.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/portal/
